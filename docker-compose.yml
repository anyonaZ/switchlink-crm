# Office-server deployment: database, app and HTTPS on one machine.
#   cp .env.example .env   (fill it in)
#   docker compose up -d --build
#   docker compose run --rm tools npm run user:create-admin -- "Your Name" you@switchlinkafrica.com
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      retries: 20

  tools:
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
      SECURE_COOKIES: "true"
    volumes:
      - storage:/app/storage
    depends_on:
      db: { condition: service_healthy }
      tools: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?set CRM_DOMAIN in .env, e.g. crm.switchlinkafrica.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  storage:
  caddy_data:
