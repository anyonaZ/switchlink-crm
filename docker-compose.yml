# Office-server deployment: database, app and HTTPS on one machine.
#   cp .env.example .env   (fill it in)
#   docker compose up -d --build
#   docker compose run --rm tools npm run user:create-admin -- "Your Name" you@switchlinkafrica.com
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      retries: 20

  tools:
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner, args: { GIT_COMMIT: "${GIT_COMMIT:-}" } }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
      SECURE_COOKIES: "true"
      BACKUP_DIR: /app/backups
    volumes:
      - storage:/app/storage
      - ./backups:/app/backups:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    depends_on:
      db: { condition: service_healthy }
      tools: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?set CRM_DOMAIN in .env, e.g. crm.switchlinkafrica.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  # Nightly backup at 01:30 Nairobi: database + uploaded files, verified, encrypted when
  # BACKUP_PASSPHRASE is set, copied off-site when RCLONE_REMOTE is set (see .env.example).
  # Status is written to ./backups/last-success.json and shown by /api/health.
  backup:
    build: { context: ., target: backup }
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: crm
      PGDATABASE: crm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      STORAGE_SRC: /storage
    volumes:
      - ./backups:/backups
      - storage:/storage:ro
      - ./rclone:/config/rclone:ro
    depends_on:
      db: { condition: service_healthy }

  # Optional virus scanning of KYC uploads: `docker compose --profile antivirus up -d`
  # and set CLAMAV_HOST=clamav in .env. Needs about 1.5 GB of RAM.
  clamav:
    image: clamav/clamav:stable
    profiles: [antivirus]
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
